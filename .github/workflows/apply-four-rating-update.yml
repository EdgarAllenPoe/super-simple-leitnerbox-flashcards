name: Apply tested four-rating update

on:
  push:
    branches:
      - feature/four-rating-study-direction

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6

      - name: Verify and install reviewed source
        shell: bash
        run: |
          cat .bootstrap/part* | base64 --decode > /tmp/leitner-update.tar.gz
          echo "d7a81e8d9d80bed7653af993f8d355dc85e4f1fff4ef687897dc09e23a5eac2f  /tmp/leitner-update.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/leitner-update.tar.gz
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md app.js core.js index.html package.json styles.css tests/core.test.js
          git add -u -- .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03 .bootstrap/part04 .bootstrap/part05 .bootstrap/part06 .bootstrap/part07 .bootstrap/part08
          git commit -m "Add four study ratings and reversible sides"
          git push origin HEAD:feature/four-rating-study-direction
