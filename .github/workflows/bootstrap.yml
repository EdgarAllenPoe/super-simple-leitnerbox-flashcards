name: Bootstrap repository

on:
  push:
    branches: [build/leitner-flashcard-site]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v6

      - name: Expand the reviewed source tree
        run: |
          cat .bootstrap/repo.part* | base64 --decode > /tmp/repo.tar.gz
          rm -rf .bootstrap
          tar -xzf /tmp/repo.tar.gz
          rm -f .github/workflows/pages.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .gitignore .nojekyll LICENSE README.md app.js core.js favicon.svg index.html package.json styles.css tests/core.test.js
          git add -u -- .bootstrap
          git commit -m "Build simple Leitner flashcard site"
          git push origin HEAD:build/leitner-flashcard-site
