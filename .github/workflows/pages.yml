name: Test and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leitner-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify JavaScript and scheduling logic
        run: npm run verify

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare static site
        run: |
          site_dir="$RUNNER_TEMP/leitner-site"
          mkdir -p "$site_dir"
          cp index.html styles.css core.js app.js favicon.svg .nojekyll "$site_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$site_dir/.build-version"

      - name: Publish verified static files
        run: |
          site_dir="$RUNNER_TEMP/leitner-site"
          git fetch origin gh-pages
          git checkout --detach origin/gh-pages
          git rm -rf .
          cp -a "$site_dir"/. .
          git add --all

          if git diff --cached --quiet; then
            echo "The published files are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi

      - name: Request GitHub Pages build
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner,
              repo,
              headers: {
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            core.info(`Requested a Pages build for ${context.sha}.`);
